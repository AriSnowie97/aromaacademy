services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aroma
      POSTGRES_PASSWORD: aroma_dev_password
      POSTGRES_DB: aromaacademy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aroma -d aromaacademy"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://aroma:aroma_dev_password@postgres:5432/aromaacademy
      SECRET_KEY: change-me-in-production
      WEBHOOK_SECRET: change-me-webhook-secret
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./media:/app/media

volumes:
  pgdata:

